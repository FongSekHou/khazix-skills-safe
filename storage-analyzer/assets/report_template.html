<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存储分析报告</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2129;--sub:#86909c;--line:#e5e6eb;--green:#00b42a;--yellow:#ff7d00;--red:#f53f3f;--accent:#165dff;--radius:14px;--shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}
  *{box-sizing:border-box;margin:0;padding:0} body{font-family:-apple-system,"SF Pro SC","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:32px 20px 80px;-webkit-font-smoothing:antialiased}.wrap{max-width:1040px;margin:auto}header{margin-bottom:28px}h1{font-size:26px;letter-spacing:-.5px}.meta,.note{color:var(--sub);font-size:13px;margin-top:6px}.overview,.summary,.item,table{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}.overview,.summary{padding:24px;margin-bottom:24px}.stats{display:flex;flex-wrap:wrap;gap:24px}.stat .k{font-size:12px;color:var(--sub)}.stat .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}.bar{height:16px;border-radius:8px;background:var(--line);overflow:hidden;display:flex;margin:16px 0 12px}.bar i{display:block;height:100%}.used,.seg-blue{background:linear-gradient(90deg,#165dff,#4080ff)}.seg-green{background:var(--green)}.seg-yellow{background:var(--yellow)}.seg-red{background:var(--red)}.bar i+i{border-left:1px solid #fff}.pills{margin-top:14px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;margin:4px 8px 4px 0;font-weight:600}.dot{display:inline-block;width:9px;height:9px;border-radius:50%}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}.dot.blue{background:var(--accent)}.sysgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 24px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:13px}.sysgrid span{color:var(--sub)}.sec{margin-bottom:28px}.sec h2{font-size:18px;margin-bottom:14px}.count{font-size:13px;color:var(--sub);font-weight:500}table{width:100%;border-collapse:collapse;overflow:hidden}th,td{text-align:left;padding:12px 14px;font-size:13px;border-bottom:1px solid var(--line)}th{background:#fafbfc;color:var(--sub);font-weight:600;font-size:12px}.table-scroll{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow)}.table-scroll table{min-width:720px;box-shadow:none}.size{font-weight:700;white-space:nowrap}.path,.item-path{font-family:"SF Mono",ui-monospace,monospace;font-size:12px;color:var(--sub);word-break:break-all}.item{margin-bottom:12px;border-left:4px solid var(--line);overflow:hidden}.item.green{border-left-color:var(--green)}.item.yellow{border-left-color:var(--yellow)}.item.red{border-left-color:var(--red)}.item-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}.item-head:hover{background:#fafbfc}.item-name{font-weight:600;font-size:15px;flex:1}.item-size{font-weight:700;color:var(--accent)}.chev{color:var(--sub);transition:transform .2s;font-size:12px}.item.open .chev{transform:rotate(90deg)}.item-body{display:none;padding:0 18px 18px;font-size:14px}.item.open .item-body{display:block}.item-path{margin-bottom:12px;padding:8px 10px;background:#fafbfc;border-radius:8px}.field{margin:10px 0}.field .label{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:3px}.tag{display:inline-block;background:#e8f3ff;color:var(--accent);font-size:12px;padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0}.risk,.warning{background:#fff7e8;border:1px solid #ffd591;border-radius:10px;padding:12px 14px;font-size:13px;margin-top:10px}.cmd{position:relative;background:#1d2129;color:#e5e6eb;border-radius:10px;padding:14px;margin:8px 0;font-family:"SF Mono",ui-monospace,monospace;font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:pre}.copy{float:right;background:#2d3138;color:#c9cdd4;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}.copy.done{background:var(--green);color:#fff}.cmd-label{font-size:11px;color:var(--sub);margin:10px 0 2px}.summary ul{padding-left:20px}.summary li{margin:4px 0;font-size:14px}footer{text-align:center;color:var(--sub);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap"><header><h1>存储分析报告</h1><div class="meta" id="meta"></div></header><div id="app"></div><footer>storage-analyzer-safe · 静态只读报告 · 命令请在终端自行确认后执行</footer></div>
<script>
const DATA = __REPORT_DATA__;
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
const cleanSize = value => String(value == null ? '' : value).replace(/[（(]\s*估算[^）)]*[）)]/g, '').trim();
function parseGB(value){const match=String(value||'').match(/([\d.]+)\s*(TB|GB|MB)?/i);if(!match)return 0;let size=parseFloat(match[1]);const unit=(match[2]||'GB').toUpperCase();if(unit==='TB')size*=1024;else if(unit==='MB')size/=1024;return size;}
function copyButton(text){const encoded=btoa(unescape(encodeURIComponent(text)));return `<button class="copy" data-cmd="${encoded}">复制</button>`;}
function commandBlock(command){const label=command.label?`<div class="cmd-label">${esc(command.label)}</div>`:'';return `${label}<div class="cmd">${copyButton(command.cmd||'')}${esc(command.cmd)}</div>`;}
function renderSystem(system,summary){document.getElementById('meta').textContent=`生成于 ${DATA.generated_at||'?'}　·　扫描耗时 ${DATA.scan_seconds||'?'}s`;
 const total=parseGB(system.disk_total)||1,used=parseGB(system.disk_used),tiers=summary&&summary.tier_stats;const green=tiers?parseGB(tiers.green):0,yellow=tiers?parseGB(tiers.yellow):0,red=tiers?parseGB(tiers.red):0,other=Math.max(0,used-green-yellow-red);const segment=(value,kind)=>value>0?`<i class="${kind}" style="width:${Math.min(100,value/total*100).toFixed(2)}%"></i>`:'';const bar=green||yellow||red?segment(green,'seg-green')+segment(yellow,'seg-yellow')+segment(red,'seg-red')+segment(other,'seg-blue'):`<i class="used" style="width:${Math.min(100,used/total*100).toFixed(2)}%"></i>`;const pill=(kind,label,value)=>`<span class="pill"><span class="dot ${kind}"></span>${label} <b>${value>0?'约 '+value.toFixed(1)+' GB':'-'}</b></span>`;const pills=tiers?`<div class="pills">${pill('green','可自动清理',green)}${pill('yellow','需人工判断',yellow)}${pill('red','谨慎清理',red)}${pill('blue','系统及其他',other)}</div>`:'';
 return `<div class="overview"><div class="stats"><div class="stat"><div class="k">总容量</div><div class="v">${esc(system.disk_total)}</div></div><div class="stat"><div class="k">已用</div><div class="v">${esc(system.disk_used)}</div></div><div class="stat"><div class="k">可用</div><div class="v">${esc(system.disk_free)}</div></div></div><div class="bar">${bar}</div>${pills}<div class="sysgrid"><div><span>系统　</span>${esc(system.os)} (${esc(system.build)})</div><div><span>架构　</span>${esc(system.arch)}</div><div><span>文件系统　</span>${esc(system.filesystem)}</div><div><span>用户　</span>${esc(system.user)}</div><div><span>主目录　</span>${esc(system.home)}</div></div></div>`;}
function renderTop(rows){if(!rows||!rows.length)return '';return `<div class="sec"><h2>占用排行 Top 5</h2><div class="table-scroll"><table><thead><tr><th>#</th><th>级</th><th>大小</th><th>类型</th><th>项目</th><th>路径</th><th>说明</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${esc(row.rank)}</td><td><span class="dot ${esc(row.tier)}"></span></td><td class="size">${esc(cleanSize(row.size))}</td><td>${esc(row.type)}</td><td><b>${esc(row.name)}</b></td><td class="path">${esc(row.path)}</td><td>${esc(row.note)}</td></tr>`).join('')}</tbody></table></div></div>`;}
function card(tier,item,body){return `<div class="item ${tier}"><div class="item-head" onclick="this.parentNode.classList.toggle('open')"><span class="dot ${tier}"></span><span class="item-name">${esc(item.name)}</span>${item.size||item.size_estimate?`<span class="item-size">${esc(cleanSize(item.size||item.size_estimate))}</span>`:''}<span class="chev">▶</span></div><div class="item-body"><div class="item-path">${esc(item.path)}</div>${body}</div></div>`;}
function section(title,items,render){return !items||!items.length?'':`<div class="sec"><h2>${esc(title)} <span class="count">${items.length} 项</span></h2>${items.map(render).join('')}</div>`;}
function green(item){const processes=item.kill_processes&&item.kill_processes.length?item.kill_processes.map(value=>`<span class="tag">${esc(value)}</span>`).join(''):'<span class="note">无需关闭任何进程</span>';const commands=(item.commands||[]).map(commandBlock).join('');return card('green',item,`<div class="field"><div class="label">清理前需关闭</div>${processes}</div><div class="field"><div class="label">清理命令（请自行确认后执行）</div>${commands}</div>`);}
function yellow(item){return card('yellow',item,`<div class="field"><div class="label">内容画像</div>${esc(item.content_profile)}</div><div class="field"><div class="label">为什么需要人工判断</div>${esc(item.why_manual)}</div><div class="field"><div class="label">处置路径</div>${esc(item.disposal)}</div><div class="risk">⚠️ ${esc(item.risk)}</div>`);}
function red(item){return card('red',item,`<div class="field"><div class="label">为什么不建议手删</div>${esc(item.why_keep)}</div><div class="field"><div class="label">卸载 / 释放建议</div>${esc(item.indirect_release)}</div>`);}
function list(values){return values&&values.length?`<ul>${values.map(value=>`<li>${esc(value)}</li>`).join('')}</ul>`:'';}
function priority(summary){if(!summary||(!summary.overview&&!summary.priority))return '';const body=Array.isArray(summary.priority)?list(summary.priority):`<p>${esc(summary.priority)}</p>`;return `<div class="sec"><h2>执行建议</h2><div class="summary"><p>${esc(summary.overview)}</p>${body}</div></div>`;}
function warnings(){const values=[...(DATA.denied||[]).map(path=>`权限不足：${path}`),...(DATA.warnings||[]).map(value=>typeof value==='string'?value:`${value.path||''}：${value.reason||'扫描不完整'}`)];return values.length?`<div class="warning"><b>扫描范围说明</b><br>${values.map(esc).join('<br>')}</div>`:'';}
const app=document.getElementById('app');app.innerHTML=renderSystem(DATA.system||{},DATA.summary)+renderTop(DATA.top5)+priority(DATA.summary)+section('🟢 可自动清理（纯缓存/临时文件，可再生）',DATA.green,green)+section('🟡 需你参与的手动清理（含用户数据）',DATA.yellow,yellow)+section('🔴 谨慎清理（建议走正规卸载）',DATA.red,red)+warnings()+(DATA.summary&&DATA.summary.long_term?`<div class="sec"><h2>长期优化建议</h2><div class="summary">${list(DATA.summary.long_term)}</div></div>`:'');
document.addEventListener('click',event=>{const button=event.target.closest('.copy');if(!button)return;event.stopPropagation();const text=decodeURIComponent(escape(atob(button.dataset.cmd)));navigator.clipboard.writeText(text).then(()=>{button.textContent='已复制';button.classList.add('done');setTimeout(()=>{button.textContent='复制';button.classList.remove('done');},1500);});});
</script>
</body>
</html>
